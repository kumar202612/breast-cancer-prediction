name: CI/CD - Breast Cancer Prediction

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: mlops-vertex-ai-tsk1
  REGION: us-east1
  ARTIFACT_REGION: us-central1
  REPO_NAME: breast-cancer-repo
  IMAGE_NAME: breast-cancer-api
  WORKLOAD_IDENTITY_PROVIDER: projects/737883058208/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-deployer@mlops-vertex-ai-tsk1.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install training dependencies
        run: pip install -U pip && pip install -r requirements.txt

      - name: Generate data + train model
        run: python deploy.py --train

      - name: Upload trained model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-pkl
          path: models/model.pkl

  test:
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model-pkl
          path: models/

      - name: Install API + test dependencies
        run: |
          pip install -U pip
          pip install -r api/requirements.txt
          pip install -r requirements_test.txt

      - name: Run tests
        run: pytest test.py -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: [train, test]
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model-pkl
          path: models/

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build -t ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push image
        run: |
          docker push ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-vertex:
    runs-on: ubuntu-latest
    needs: [train, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model-pkl
          path: models/

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install deploy dependencies
        run: pip install -U pip && pip install -r requirements.txt

      - name: Register + deploy model to Vertex AI endpoint
        run: python deploy.py --deploy

      - name: Test the deployed endpoint
        run: python deploy.py --test
